# Настройки WebTrade

currency:
  # Сколько ар даёт 1 единица алмазной глубиносланцевой руды
  ore-per-are: 1.0

market:
  # Крючок под будущую комиссию биржи (0 = без комиссии)
  fee-percent: 0.0

calculator:
  # Выгружать calculator.html при старте, чтобы страница не отставала от цен.
  # Вручную то же самое делает /tradecalc.
  export-on-start: true
  # Адрес выложенной страницы. Пусто — кнопка «Открыть калькулятор» не показывается.
  # Клиент всё равно спросит подтверждение перед переходом — это ванильное поведение.
  url: ""
  # Русские названия и значки предметов с серверов Mojang (разово ~40 МБ, дальше из кэша assets/).
  # Значки ложатся в calculator-icons.png рядом со страницей — выкладывайте их вместе.
  icons: true

commands:
  # Что видит игрок без права webtrade.command, когда пишет /trade, /sell и т.п. (MiniMessage)
  no-remote-access: "<gray>Биржа открывается на стендах торгового центра."

# Каталог торгуемых ресурсов и цены — в отдельном файле resources.yml
# (создаётся автоматически при первом запуске).
